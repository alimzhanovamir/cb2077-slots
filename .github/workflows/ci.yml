name: CI

on:
  # Branches are checked through their pull request; a push to a branch would run everything twice.
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6 # version from `packageManager` in package.json
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm build:demo

  e2e:
    # Two jobs in parallel, one per transport mode (ADR 012).
    name: E2E (${{ matrix.mode }})
    needs: check
    # Pinned: Playwright's system dependencies are known for this image.
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        mode: [ws, demo]
    env:
      CI: true
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6 # version from `packageManager` in package.json
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # Restore and save separately, so the browsers are cached even when tests fail.
      - name: Restore Playwright browsers
        id: playwright-cache
        uses: actions/cache/restore@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm --filter @cb2077/e2e exec playwright install --with-deps chromium webkit
      - name: Install Playwright system dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm --filter @cb2077/e2e exec playwright install-deps chromium webkit
      - name: Save Playwright browsers
        if: always() && steps.playwright-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ~/.cache/ms-playwright
          key: ${{ steps.playwright-cache.outputs.cache-primary-key }}

      - run: pnpm --filter @cb2077/e2e e2e:${{ matrix.mode }}

      - name: Upload test artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-results-${{ matrix.mode }}
          path: |
            e2e/test-results
            e2e/playwright-report
          retention-days: 7
