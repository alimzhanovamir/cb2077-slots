name: CI

on:
  # Branches are checked through their pull request; a push to a branch would run everything twice.
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6 # version from `packageManager` in package.json
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm build:demo

  e2e:
    # Two jobs in parallel, one per transport mode (ADR 012).
    name: E2E (${{ matrix.mode }})
    needs: check
    runs-on: ubuntu-latest
    # Browsers and their system packages come preinstalled: installing them with apt took up to an
    # hour on some runners. The tag must match the Playwright version in pnpm-lock.yaml.
    container: mcr.microsoft.com/playwright:v1.63.0-noble
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        mode: [ws, demo]
    env:
      CI: true
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6 # version from `packageManager` in package.json
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - run: pnpm --filter @cb2077/e2e e2e:${{ matrix.mode }}

      - name: Upload test artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-results-${{ matrix.mode }}
          path: |
            e2e/test-results
            e2e/playwright-report
          retention-days: 7
