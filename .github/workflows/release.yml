name: Release

# After every merge into `main`, or by hand: works out the next version from the pull requests
# merged since the last release, commits it as `chore(release): X.Y.Z`, tags `vX.Y.Z` and pushes
# (CONTRIBUTING.md, "Versions"). The merged code already passed CI in its pull request: the ruleset
# of `main` only accepts branches that are up to date with it. The version is worked out from the
# tags, so a re-run or a manual run releases whatever a failed run left behind.
#
# It pushes with a deploy key: `main` is protected, and the key is the only one allowed to bypass
# it. The key is a secret of the `release` environment, which is given to jobs on `main` only. A
# push made with the key also starts the Pages deploy for the new tag.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Release
    # Only on `main`; the release commit itself releases nothing.
    if: >-
      github.ref == 'refs/heads/main' &&
      !startsWith(github.event.head_commit.message, 'chore(release):')
    runs-on: ubuntu-24.04
    environment: release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main # the latest `main`: a run for an older merge releases the newer ones too
          ssh-key: ${{ secrets.RELEASE_DEPLOY_KEY }}
          fetch-depth: 0 # the tags decide which versions are released

      - name: Work out the version
        id: version
        run: node scripts/release.js

      - name: Commit, tag and push
        if: steps.version.outputs.released == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if ! git diff --quiet; then
            git commit -am "chore(release): ${VERSION}"
          fi

          git tag -a "v${VERSION}" -m "${VERSION}"

          # Both or neither: a commit without its tag would be released twice.
          git push --atomic origin HEAD:main "v${VERSION}"
